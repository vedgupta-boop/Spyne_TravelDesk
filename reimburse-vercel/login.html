<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Spyne ReimburseDesk</title>
<style>
  :root{--navy:#0D1B2A;--red:#E8232A;--gray-3:#e2e8f0;--gray-5:#8A97AA;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:linear-gradient(160deg,#0D1B2A,#14283f);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
  .card{background:#fff;border-radius:18px;padding:40px 34px;max-width:400px;width:100%;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.3);}
  .logo-sq{width:54px;height:54px;border-radius:14px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px;margin:0 auto 16px;}
  h1{color:var(--navy);font-size:22px;margin:0 0 4px;} h1 span{color:#9fb3c8;}
  p{color:var(--gray-5);font-size:13.5px;line-height:1.5;margin:0 0 24px;}
  a.g{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;border:1px solid var(--gray-3);border-radius:10px;padding:13px;font-weight:700;color:var(--navy);font-size:15px;}
  a.g:hover{background:#f6f8fb;}
  .foot{margin-top:22px;font-size:11.5px;color:var(--gray-5);}
</style>
</head>
<body>
<div class="card">
  <div class="logo-sq">S</div>
  <h1>Spyne <span>ReimburseDesk</span></h1>
  <p>Out-of-pocket expense reimbursements.<br>Sign in with your <b>@spyne.ai</b> Google account.</p>
  <a class="g" id="google" href="#">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.4 30.1 0 24 0 14.6 0 6.4 5.4 2.5 13.3l7.9 6.1C12.2 13.7 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.5 3-2.2 5.5-4.7 7.2l7.3 5.7c4.3-3.9 6.8-9.7 6.8-17.4z"/><path fill="#FBBC05" d="M10.4 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.1.8-4.6l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.5 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.1 0 11.3-2 15-5.5l-7.3-5.7c-2 1.4-4.7 2.3-7.7 2.3-6.4 0-11.8-4.2-13.6-9.9l-7.9 6.1C6.4 42.6 14.6 48 24 48z"/></svg>
    Continue with Google
  </a>
  <div class="foot">Access restricted to @spyne.ai accounts.</div>
</div>
<script>
  var next=(location.search.match(/next=([^&]*)/)||[])[1]||'';
  document.getElementById('google').href='/api/auth/login'+(next?'?next='+next:'');
</script>
</body>
</html>
